<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RSA Terminal Web</title>
<style>
body {
    background: #0d0d0d;
    color: #00ff88;
    font-family: monospace;
    margin: 0;
}

#terminal {
    padding: 10px;
    height: 90vh;
    overflow-y: auto;
    white-space: pre-wrap;
}

#input {
    width: 100%;
    padding: 10px;
    border: none;
    outline: none;
    background: #111;
    color: #00ff88;
    font-family: monospace;
}
button {
    background: #111;
    color: #00ff88;
    border: 1px solid #00ff88;
    padding: 5px;
    margin: 3px;
}
</style>
</head>
<body>

<div id="terminal"></div>

<input id="input" placeholder="Escribe comando: help" />

<div>
<button onclick="cmd('help')">help</button>
<button onclick="cmd('gen')">gen keys</button>
<button onclick="cmd('enc')">encrypt</button>
<button onclick="cmd('dec')">decrypt</button>
</div>

<script>

// ───────── TERMINAL ─────────
const term = document.getElementById("terminal");
const input = document.getElementById("input");

function log(msg){
    term.textContent += msg + "\n";
    term.scrollTop = term.scrollHeight;
}

// ───────── ABECEDARIO ─────────
const ABC = "abcdefghijklmnopqrstuvwxyz".split("");
const map = {};
const rev = {};

ABC.forEach((c,i)=>{
    map[c]=i+1;
    rev[i+1]=c;
});

// ───────── MATH ─────────
function modPow(base, exp, mod){
    let result = 1;
    base %= mod;
    while(exp > 0){
        if(exp % 2 === 1) result = (result * base) % mod;
        base = (base * base) % mod;
        exp = Math.floor(exp / 2);
    }
    return result;
}

function gcd(a,b){
    while(b){
        [a,b]=[b,a%b];
    }
    return a;
}

// Miller-Rabin simple
function isPrime(n){
    if(n<2) return false;
    if(n%2===0) return n===2;

    let d=n-1,r=0;
    while(d%2===0){d/=2;r++;}

    for(let i=0;i<5;i++){
        let a = 2 + Math.floor(Math.random()*(n-3));
        let x = modPow(a,d,n);

        if(x===1||x===n-1) continue;

        let ok=false;
        for(let j=0;j<r-1;j++){
            x=(x*x)%n;
            if(x===n-1){ok=true;break;}
        }
        if(!ok) return false;
    }
    return true;
}

function randPrime(bits){
    while(true){
        let n = Math.floor(Math.random()*2**bits);
        n |= (1<<(bits-1)) | 1;
        if(isPrime(n)) return n;
    }
}

// ───────── RSA STATE ─────────
let n,e,d;

// ───────── COMMANDS ─────────
function cmd(c){

    if(c==="help"){
        log("Comandos:");
        log("gen → generar claves");
        log("enc → cifrar texto");
        log("dec → descifrar números");
        return;
    }

    if(c==="gen"){
        let p = randPrime(10);
        let q = randPrime(10);
        n = p*q;
        let phi = (p-1)*(q-1);

        e = 65537;
        if(gcd(e,phi)!==1){
            e = 3;
            while(gcd(e,phi)!==1) e+=2;
        }

        d = 1;
        while((d*e)%phi!==1) d++;

        log("Claves generadas:");
        log("n="+n);
        log("e="+e);
        log("d="+d);
        return;
    }

    if(c==="enc"){
        let text = prompt("Texto:");
        let nums = text.split("").map(ch=>{
            if(ch===" ") return 0;
            return map[ch.toLowerCase()]||0;
        });

        let enc = nums.map(v=>modPow(v,e,n));
        log("Cifrado:");
        log(enc.join(" "));
        return;
    }

    if(c==="dec"){
        let inputNums = prompt("Números:");
        let nums = inputNums.split(" ").map(Number);

        let dec = nums.map(v=>{
            if(!d) return 0;
            return modPow(v,d,n);
        });

        let text = dec.map(v=>{
            if(v===0) return " ";
            return rev[v]||"?";
        }).join("");

        log("Texto:");
        log(text);
        return;
    }
}

input.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
        cmd(input.value.trim());
        input.value="";
    }
});

log("RSA Web Terminal listo. Escribe 'help'");

</script>

</body>
</html>
