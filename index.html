<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firma Digital RSA</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #121212;
        color: white;
        text-align: center;
        padding: 20px;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: #1e1e1e;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    input, button, select {
        width: 90%;
        padding: 12px;
        margin: 8px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    input, select {
        background: #2d2d2d;
        color: white;
    }

    button {
        background: #00aaff;
        color: white;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #0088cc;
    }

    #resultado {
        margin-top: 20px;
        text-align: left;
        white-space: pre-wrap;
        background: #2d2d2d;
        padding: 15px;
        border-radius: 10px;
    }

    .hidden {
        display: none;
    }
</style>
</head>
<body>

<div class="container">
    <h1>🔐 Firma Digital RSA</h1>

    <select id="modo" onchange="cambiarModo()">
        <option value="firmar">Firmar</option>
        <option value="comprobar">Comprobar</option>
    </select>

    <div id="firmarDiv">
        <input id="mensajeFirmar" placeholder="Mensaje a firmar">
        <input id="p" type="number" placeholder="p">
        <input id="q" type="number" placeholder="q">
        <input id="e" type="number" placeholder="e">
        <button onclick="firmar()">Firmar</button>
    </div>

    <div id="comprobarDiv" class="hidden">
        <input id="mensajeComprobar" placeholder="Mensaje recibido">
        <input id="firma" type="number" placeholder="Firma">
        <input id="n" type="number" placeholder="n">
        <input id="eComp" type="number" placeholder="e">
        <button onclick="comprobar()">Comprobar</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
function gcd(a,b){
    while(b!==0){
        [a,b]=[b,a%b];
    }
    return a;
}

function modInverse(a,m){
    for(let x=1;x<m;x++){
        if((a*x)%m===1) return x;
    }
    return null;
}

async function sha256(msg){
    const data = new TextEncoder().encode(msg);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2,"0")).join("");
    return hashHex;
}

function modPow(base, exp, mod){
    base = BigInt(base);
    exp = BigInt(exp);
    mod = BigInt(mod);

    let result = 1n;

    while(exp > 0){
        if(exp % 2n === 1n)
            result = (result * base) % mod;

        exp = exp / 2n;
        base = (base * base) % mod;
    }

    return result;
}

function cambiarModo(){
    const modo = document.getElementById("modo").value;

    document.getElementById("firmarDiv").classList.toggle("hidden", modo !== "firmar");
    document.getElementById("comprobarDiv").classList.toggle("hidden", modo !== "comprobar");
    document.getElementById("resultado").innerText = "";
}

async function firmar(){
    const mensaje = document.getElementById("mensajeFirmar").value;
    const p = parseInt(document.getElementById("p").value);
    const q = parseInt(document.getElementById("q").value);
    const e = parseInt(document.getElementById("e").value);

    const n = p*q;
    const r = (p-1)*(q-1);

    if(gcd(e,r)!==1){
        document.getElementById("resultado").innerText =
            "❌ e no es válido";
        return;
    }

    const d = modInverse(e,r);

    const hashHex = await sha256(mensaje);
    const hashInt = BigInt("0x"+hashHex);
    const reducido = hashInt % BigInt(n);

    const firma = modPow(reducido,d,n);

    document.getElementById("resultado").innerText =
`--- FIRMA GENERADA ---
Hash hex: ${hashHex}

n: ${n}
r: ${r}
d: ${d}

Hash reducido: ${reducido}

Firma: ${firma}`;
}

async function comprobar(){
    const mensaje = document.getElementById("mensajeComprobar").value;
    const firma = BigInt(document.getElementById("firma").value);
    const n = parseInt(document.getElementById("n").value);
    const e = parseInt(document.getElementById("eComp").value);

    const hashHex = await sha256(mensaje);
    const hashInt = BigInt("0x"+hashHex);
    const reducido = hashInt % BigInt(n);

    const recuperado = modPow(firma,e,n);

    let valido = recuperado === reducido;

    document.getElementById("resultado").innerText =
`--- COMPROBACIÓN ---
Hash hex: ${hashHex}

Hash reducido: ${reducido}

Hash recuperado: ${recuperado}

${valido ? "✅ La firma es real" : "❌ La firma NO es real"}`;
}
</script>

</body>
</html>
