<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSA Console</title>

<style>
    body{
        margin:0;
        background:black;
        color:#00ff00;
        font-family: monospace;
        overflow:hidden;
    }

    #terminal{
        padding:20px;
        height:100vh;
        overflow-y:auto;
        white-space:pre-wrap;
    }

    .line{
        margin:2px 0;
    }

    #inputLine{
        display:flex;
        align-items:center;
    }

    #prompt{
        margin-right:5px;
    }

    input{
        background:black;
        color:#00ff00;
        border:none;
        outline:none;
        font-family: monospace;
        font-size:16px;
        width:100%;
    }

    .cursor{
        display:inline-block;
        width:10px;
        background:#00ff00;
        animation: blink 1s infinite;
    }

    @keyframes blink{
        50%{
            opacity:0;
        }
    }
</style>
</head>
<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

let estado = "";
let datos = {};

function print(text=""){
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
}

function input(promptText, callback){
    const line = document.createElement("div");
    line.id = "inputLine";

    const prompt = document.createElement("span");
    prompt.id = "prompt";
    prompt.textContent = promptText;

    const inp = document.createElement("input");

    line.appendChild(prompt);
    line.appendChild(inp);

    terminal.appendChild(line);

    inp.focus();

    inp.addEventListener("keydown", async (e)=>{
        if(e.key==="Enter"){
            const value = inp.value;

            line.innerHTML = promptText + value;

            callback(value);
        }
    });

    terminal.scrollTop = terminal.scrollHeight;
}

function gcd(a,b){
    while(b!==0){
        [a,b]=[b,a%b];
    }
    return a;
}

function modInverse(a,m){
    a=((a%m)+m)%m;

    for(let x=1;x<m;x++){
        if((a*x)%m===1){
            return x;
        }
    }

    return null;
}

function modPow(base, exp, mod){
    base = BigInt(base);
    exp = BigInt(exp);
    mod = BigInt(mod);

    let result = 1n;

    while(exp > 0n){
        if(exp % 2n === 1n){
            result = (result * base) % mod;
        }

        exp = exp / 2n;
        base = (base * base) % mod;
    }

    return result;
}

async function sha256(message){
    const msgBuffer = new TextEncoder().encode(message);

    const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);

    const hashArray = Array.from(new Uint8Array(hashBuffer));

    return hashArray.map(b =>
        b.toString(16).padStart(2,"0")
    ).join("");
}

function reiniciar(){
    print("");
    print("=== Programa de firma digital RSA ===");

    input("¿Quieres firmar o comprobar? (f/c): ", async (opcion)=>{

        opcion = opcion.toLowerCase();

        if(opcion==="f" || opcion==="firmar"){
            firmarFlow();
        }

        else if(opcion==="c" || opcion==="comprobar"){
            comprobarFlow();
        }

        else{
            print("Opción no válida");
            preguntarReinicio();
        }
    });
}

async function firmarFlow(){

    print("");
    print("--- Modo: Firmar ---");

    input("Introduce un mensaje: ", async (mensaje)=>{

        const hashHex = await sha256(mensaje);

        print("Hash en hex: " + hashHex);

        const hashInt = BigInt("0x"+hashHex);

        print("Hash como entero: " + hashInt);

        input("Introduce p: ", (p)=>{

            input("Introduce q: ", (q)=>{

                const n = Number(p) * Number(q);

                print("n: " + n);

                const r = (Number(p)-1)*(Number(q)-1);

                print("r: " + r);

                input("Introduce e: ", (e)=>{

                    e = Number(e);

                    if(gcd(e,r)===1){
                        print("e es válido");
                    }

                    else{
                        print("e no es válido");
                        preguntarReinicio();
                        return;
                    }

                    const d = modInverse(e,r);

                    print("d: " + d);

                    const reducido = hashInt % BigInt(n);

                    print("Hash reducido: " + reducido);

                    print("Setup completo, calculando firma...");

                    const firma = modPow(reducido,d,n);

                    print("Firma: " + firma);

                    input("¿Quieres comprobar si devuelve el hash? (si/no): ", (resp)=>{

                        if(resp.toLowerCase()==="si" || resp===""){

                            const recuperado = modPow(firma,e,n);

                            print("Hash recuperado: " + recuperado);

                            if(recuperado===reducido){
                                print("El programa ha funcionado correctamente");
                            }

                            else{
                                print("El hash NO coincide");
                            }
                        }

                        preguntarReinicio();
                    });
                });
            });
        });
    });
}

async function comprobarFlow(){

    print("");
    print("--- Modo: Comprobar ---");

    input("Introduce el mensaje que te han enviado: ", async (mensaje)=>{

        input("Introduce la firma: ", async (firma)=>{

            const hashHex = await sha256(mensaje);

            print("Hash en hex: " + hashHex);

            const hashInt = BigInt("0x"+hashHex);

            print("Hash como entero: " + hashInt);

            input("Introduce n: ", (n)=>{

                input("Introduce e: ", (e)=>{

                    const reducido = hashInt % BigInt(n);

                    print("Setup completado, calculando hash...");

                    const supuestoHash = modPow(firma,e,n);

                    print("El hash resultado es: " + supuestoHash);

                    if(supuestoHash===reducido){
                        print("La firma es real");
                    }

                    else{
                        print("La firma NO es real o los valores introducidos están mal");
                    }

                    preguntarReinicio();
                });
            });
        });
    });
}

function preguntarReinicio(){

    input("¿Reiniciar el programa? (y/n): ", (resp)=>{

        if(resp.toLowerCase()==="y" || resp===""){
            print("");
            print("========================================");
            print("");
            reiniciar();
        }

        else{
            print("Hasta luego.");
        }
    });
}

reiniciar();
</script>

</body>
</html>
